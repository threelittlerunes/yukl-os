intent:
  goal: "Add the Orca runtime adapter."
  depends_on:
    - "v2-w1-runtime"
  scope:
    allowed_paths:
      - "scripts/adapters/orca.js"
      - "tests/adapter-orca.test.js"
      - "tests/fixtures/fake-orca/**"
      - ".orchestration/contracts/v2-w2-orca-adapter.json"
    forbidden_paths:
      - "scripts/yukl.js"
      - "scripts/validate-config.js"
      - "scripts/repo-checks.js"
      - "scripts/count-instructions.js"
      - "package.json"
      - "package-lock.json"
      - "yukl.config.json"
      - "yukl.policy.json"
      - ".gitignore"
      - ".github/**"
      - ".claude/**"
      - ".orchestration/intents/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "flow.config.json"
      - "review.config.json"
      - "orca.yaml"
      - "templates/**"

consultation:
  requires_human_approval: false

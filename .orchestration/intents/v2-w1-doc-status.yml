intent:
  goal: "Add the opt-in doc-status validator for section status markers."
  depends_on:
    - "v2-w0-test-runner"
    - "v2-w0-cli-seams"
  scope:
    allowed_paths:
      - "scripts/validators/doc-status.js"
      - "tests/doc-status.test.js"
      - "tests/fixtures/doc-status/**"
      - ".orchestration/contracts/v2-w1-doc-status.json"
    forbidden_paths:
      - "scripts/yukl.js"
      - "scripts/validate-config.js"
      - "scripts/repo-checks.js"
      - "scripts/count-instructions.js"
      - "package.json"
      - "package-lock.json"
      - "yukl.config.json"
      - "yukl.policy.json"
      - ".gitignore"
      - ".github/**"
      - ".claude/**"
      - ".orchestration/intents/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "flow.config.json"
      - "review.config.json"
      - "orca.yaml"
      - "templates/**"

consultation:
  requires_human_approval: false
